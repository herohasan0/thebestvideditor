<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Best Video Editor</title>
<meta name="description" content="Free video editor in your browser. Cut, trim, reorder, export up to 4K. Your files never leave your computer.">
<link rel="stylesheet" href="style.css">
</head>
<body class="empty">

<section id="home">
  <strong class="logo">the best video editor</strong>
  <button id="new">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    New project
  </button>
  <h2>Recent projects</h2>
  <p id="none">No projects yet. Everything you make is saved in this browser, on your computer.</p>
  <div id="projects"></div>
</section>

<header>
  <a class="back" href="#" title="All projects" aria-label="All projects"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></a>
  <button id="lib" title="Show or hide the media panel" aria-label="Media panel" aria-controls="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <input id="name" aria-label="Project name" maxlength="80" spellcheck="false">
  <span class="grow"></span>
  <button id="side" class="tog" title="Layout: player down the right side, for vertical video" aria-label="Side player layout"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16M3 13h11"/></svg></button>
  <label class="sr" for="res">Export resolution</label>
  <select id="res" title="Export resolution">
    <option value="0">Source size</option>
    <option value="720">720p</option>
    <option value="1080">1080p</option>
    <option value="1440">1440p</option>
    <option value="2160">4K</option>
  </select>
  <button id="export" class="primary">Export</button>
</header>

<aside id="library">
  <h2>Media</h2>
  <button id="upload">Upload</button>
  <div id="media"></div>
  <p id="hint"></p>
</aside>

<main id="stage">
  <div id="frame">
    <div id="view"><div id="texts"></div></div>
    <svg id="guide" viewBox="0 0 270 480" aria-hidden="true" hidden>
      <defs>
        <symbol id="g-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>
        <symbol id="g-talk" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></symbol>
        <symbol id="g-send" viewBox="0 0 24 24"><path d="M3 10 21 3l-7 18-3-8z"/></symbol>
        <symbol id="g-find" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
        <symbol id="g-cam" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
        <symbol id="g-up" viewBox="0 0 24 24"><path d="M7 10v10H3V10zm0 0 4-7c2 0 3 1 2.5 3L13 9h6a2 2 0 0 1 2 2.5l-1.5 7a2 2 0 0 1-2 1.5H7"/></symbol>
        <symbol id="g-down" viewBox="0 0 24 24"><use href="#g-up" transform="rotate(180 12 12)"/></symbol>
        <symbol id="g-remix" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3V3M20 12a8 8 0 0 1-14 5.3V21M12 9v6m-3-3h6"/></symbol>
        <symbol id="g-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
      </defs>
      <text x="22" y="20" font-size="11" font-weight="600">9:41</text>
      <g data-p="tiktok">
        <text x="135" y="50" text-anchor="middle" font-size="10">Following&#160;&#160;|&#160;&#160;For You</text>
        <use href="#g-find" x="232" y="36" width="20" height="20"/>
        <use href="#g-heart" x="232" y="268" width="22" height="22"/><text x="243" y="300" text-anchor="middle">2.8M</text><use href="#g-talk" x="232" y="316" width="22" height="22"/><text x="243" y="348" text-anchor="middle">2.8M</text><use href="#g-send" x="232" y="364" width="22" height="22"/><text x="243" y="396" text-anchor="middle">2.8M</text><use href="#g-more" x="232" y="412" width="22" height="22"/><text x="243" y="444" text-anchor="middle"></text>
        <circle cx="32" cy="410" r="11" class="f"/><text x="50" y="413" font-size="10">@Your name</text><text x="21" y="440" font-size="9">Here are some descriptions about videos</text><circle cx="27" cy="459" r="5" class="f"/><text x="38" y="462" font-size="8">Music name</text>
        <circle cx="243" cy="456" r="11" class="f"/>
      </g>
      <g data-p="reels">
        <text x="22" y="52" font-size="13" font-weight="600">Reels</text>
        <use href="#g-cam" x="232" y="36" width="20" height="20"/>
        <use href="#g-heart" x="232" y="268" width="22" height="22"/><text x="243" y="300" text-anchor="middle">2.8M</text><use href="#g-talk" x="232" y="316" width="22" height="22"/><text x="243" y="348" text-anchor="middle">2.8M</text><use href="#g-send" x="232" y="364" width="22" height="22"/><text x="243" y="396" text-anchor="middle">2.8M</text><use href="#g-more" x="232" y="412" width="22" height="22"/><text x="243" y="444" text-anchor="middle"></text>
        <circle cx="32" cy="410" r="11" class="f"/><text x="50" y="413" font-size="10">@Your name</text><text x="21" y="440" font-size="9">Here are some descriptions about videos</text><circle cx="27" cy="459" r="5" class="f"/><text x="38" y="462" font-size="8">Music name</text>
        <rect x="233" y="446" width="20" height="20" rx="4" class="f"/>
      </g>
      <g data-p="shorts">
        <use href="#g-find" x="204" y="36" width="20" height="20"/><use href="#g-more" x="234" y="36" width="20" height="20" transform="rotate(90 244 46)"/>
        <use href="#g-up" x="232" y="172" width="22" height="22"/><text x="243" y="204" text-anchor="middle">2.8M</text><use href="#g-down" x="232" y="226" width="22" height="22"/><text x="243" y="258" text-anchor="middle">Dislike</text><use href="#g-talk" x="232" y="280" width="22" height="22"/><text x="243" y="312" text-anchor="middle">2.8M</text><use href="#g-send" x="232" y="334" width="22" height="22"/><text x="243" y="366" text-anchor="middle">2.8M</text><use href="#g-remix" x="232" y="388" width="22" height="22"/><text x="243" y="420" text-anchor="middle">2.8M</text>
        <circle cx="32" cy="436" r="11" class="f"/><text x="50" y="439" font-size="10">@Your name</text><text x="21" y="466" font-size="9">Here are some descriptions about videos</text>
        <rect x="231" y="446" width="24" height="20" rx="4" class="f"/>
      </g>
    </svg>
    <i id="gx" hidden></i><i id="gy" hidden></i>
    <div id="box" hidden><b class="nw"></b><b class="ne"></b><b class="sw"></b><b class="se"></b><b class="rot" title="Rotate (R turns 90°)"></b></div>
  </div>
  <button id="drop">
    <b>Drag media here</b>
    <span>from the left, or click to upload. Nothing leaves your computer.</span>
  </button>
</main>

<aside id="props" aria-label="Selected clip" hidden>
  <h2 id="pname"></h2>
  <div class="row"><label for="text">Text</label><input id="text" placeholder="Text" maxlength="200" hidden></div>
  <div class="row"><label for="tsize">Size</label><input id="tsize" type="range" min="0.03" max="0.3" step="0.005" hidden></div>
  <div class="row"><label for="tcolor">Colour</label><input id="tcolor" type="color" hidden></div>
  <div class="row"><label for="vol">Volume</label>
    <button id="mute" title="Mute (⇧M)" aria-label="Mute" hidden>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" hidden></div>
  <div class="row"><label for="scale">Zoom</label><input id="scale" type="range" min="0.2" max="4" step="0.01" title="Zoom the clip inside the frame. Drag the picture to move it." hidden></div>
  <div class="row"><label for="opac">Opacity</label><input id="opac" type="range" min="0" max="1" step="0.01" value="1" hidden></div>
  <div class="row"><label for="fin">Fade in</label><input id="fin" type="range" min="0" max="3" step="0.1" value="0" title="Seconds to fade in at the start of the clip"><output id="fin-s"></output></div>
  <div class="row"><label for="fout">Fade out</label><input id="fout" type="range" min="0" max="3" step="0.1" value="0" title="Seconds to fade out at the end of the clip"><output id="fout-s"></output></div>
  <div class="row btns">
    <button id="cover" title="Fill the frame with this clip (centres it and crops what sticks out)" hidden>Fill frame</button>
    <button id="crop" class="tog" title="Crop: drag the corners to cut the picture's edges" aria-pressed="false" hidden>Crop</button>
    <button id="reset" title="Reset zoom, position, rotation, crop and opacity" hidden>Reset</button>
  </div>
</aside>

<div id="pbar">
<div class="in">
  <output id="time">0:00.00 / 0:00.00</output>
  <button id="play" class="round" title="Play / pause (Space)" aria-label="Play or pause">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16" stroke-width="4"/></svg>
  </button>
  <div>
  <label class="sr" for="ratio">Aspect ratio</label>
  <select id="ratio" title="Aspect ratio">
    <option value="">Original</option>
    <option>16:9</option>
    <option>9:16</option>
    <option>1:1</option>
    <option>4:5</option>
    <option>4:3</option>
    <option>3:4</option>
    <option>21:9</option>
  </select>
  <label class="sr" for="plat">Platform guide</label>
  <select id="plat" title="Show where a platform's buttons and captions cover the picture (preview only, never exported)">
    <option value="">No guide</option>
    <option value="tiktok">TikTok</option>
    <option value="reels">Reels</option>
    <option value="shorts">Shorts</option>
  </select>
  <button id="fill" title="Fill the frame (crops the edges) instead of fitting inside it" aria-pressed="false">Fill</button>
  </div>
</div>
</div>

<div id="bar">
  <button id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <i class="sep"></i>
  <button id="split" title="Split at playhead (S)">Split</button>
  <button id="del" title="Delete selected clip (⌫)">Delete</button>
  <button id="addtext" title="Add text at the playhead">+ Text</button>
  <span class="grow"></span>
  <button id="magnet" class="tog" title="Main track magnet: clips close up by themselves. Off: deleting, trimming and dragging leave empty space." aria-label="Main track magnet"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="8" height="8" rx="1.5"/><rect x="14" y="8" width="8" height="8" rx="1.5"/><path d="M10 12h4"/></svg></button>
  <button id="snap" class="tog" title="Auto snapping: what you drag sticks to clip edges, markers and the playhead" aria-label="Auto snapping"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h5M21 12h-5M6 9l3 3-3 3M18 9l-3 3 3 3"/></svg></button>
  <button id="link" class="tog" title="Linkage: audio and text move with the main clip they start over" aria-label="Linkage"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
  <label class="sr" for="zoom">Timeline zoom</label>
  <input id="zoom" type="range" min="-3" max="8" step="0.1" value="6" title="Timeline zoom">
</div>

<div id="grip" role="separator" aria-orientation="horizontal" aria-label="Timeline height" tabindex="0" title="Drag to resize the timeline"></div>
<div id="timeline">
  <div id="lane">
    <div id="ruler"></div>
    <div id="ttrack" aria-label="Text track"></div>
    <div id="otrack" aria-label="Overlay track" title="Drop a video or image here to put it over the main track"></div>
    <div id="track"></div>
    <div id="atrack" aria-label="Audio track"></div>
    <div id="head"></div>
  </div>
</div>

<div id="menu" role="menu" hidden>
  <button id="m-detach" role="menuitem">Detach audio <kbd>D</kbd></button>
  <button id="m-delete" role="menuitem">Delete <kbd>⌫</kbd></button>
</div>

<div id="modal" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="pct">
    <b id="pct">Exporting… 0%</b>
    <progress id="prog" max="1" value="0"></progress>
    <button id="cancel">Cancel</button>
  </div>
</div>
<div id="ask" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="ask-t">
    <b id="ask-t"></b>
    <button id="ask-ok"></button>
    <button id="ask-no"></button>
  </div>
</div>
<div id="toast" role="status"></div>
<input id="file" type="file" accept="video/*,image/*,audio/*" multiple hidden>

<script type="module" src="app.js"></script>
</body>
</html>
